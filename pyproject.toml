[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-memory-design-explorer"
version = "0.1.0"
description = "Educational NPU memory hierarchy design-space exploration for tiled GEMM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
npu-explore = "npu_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
